definitions:
  httpsuite.APIError:
    properties:
      error:
        type: string
    type: object
  models.AlarmRule:
    description: ID unique identifier for the alarm rule Name human-readable name
      for the alarm rule Type type of the alarm (e.g., "channels", "connections",
      "queues", etc.) QueueName optional name of the queue - required for "queues"
      alarm types Threshold numeric threshold that triggers the alarm Message custom
      message to include in the notification when the alarm is triggered Enabled indicates
      whether the alarm rule is active
    properties:
      enabled:
        type: boolean
      id:
        type: string
      last_fired:
        type: string
      last_value:
        type: number
      message:
        type: string
      name:
        type: string
      queue_name:
        type: string
      status:
        $ref: '#/definitions/models.AlarmStatus'
      threshold:
        type: number
      type:
        $ref: '#/definitions/models.AlarmType'
    type: object
  models.AlarmRuleUpdate:
    properties:
      message:
        type: string
      threshold:
        type: number
    type: object
  models.AlarmStatus:
    enum:
    - active
    - inactive
    - fired
    type: string
    x-enum-varnames:
    - Active
    - Inactive
    - Fired
  models.AlarmType:
    enum:
    - channels
    - connections
    - queues
    - unacked
    - queue_messages
    - queue_size
    - no_consumer
    - maintenance
    type: string
    x-enum-varnames:
    - Channels
    - Connections
    - Queues
    - Unacked_Messages
    - Queue_Messages
    - Queue_Size
    - No_Consumer
    - Maintenance
  models.ClusterStats:
    properties:
      min_disk_limit:
        type: integer
      nodes:
        items:
          $ref: '#/definitions/models.NodeStats'
        type: array
      total_disk_free:
        type: integer
      total_mem_limit:
        type: integer
      total_mem_used:
        type: integer
      vhost_resources:
        items:
          $ref: '#/definitions/models.VhostResources'
        type: array
    type: object
  models.MaintenanceAdminResponse:
    properties:
      entries:
        items:
          $ref: '#/definitions/models.MaintenanceEntry'
        type: array
    type: object
  models.MaintenanceEntry:
    properties:
      description:
        type: string
      end:
        type: string
      id:
        type: string
      notified:
        type: boolean
      start:
        type: string
      status:
        $ref: '#/definitions/models.MaintenanceStatus'
    type: object
  models.MaintenanceResponse:
    properties:
      history:
        items:
          $ref: '#/definitions/models.MaintenanceEntry'
        type: array
      scheduled:
        items:
          $ref: '#/definitions/models.MaintenanceEntry'
        type: array
    type: object
  models.MaintenanceStatus:
    enum:
    - scheduled
    - done
    - skipped
    - unknown
    type: string
    x-enum-varnames:
    - MaintenanceStatusScheduled
    - MaintenanceStatusDone
    - MaintenanceStatusSkipped
    - MaintenanceStatusUnknown
  models.MessageRate:
    properties:
      rate:
        type: number
    type: object
  models.Metadata:
    properties:
      default_queue_type:
        type: string
      description:
        type: string
      tags:
        items:
          type: string
        type: array
    type: object
  models.NodeStats:
    properties:
      disk_free:
        type: integer
      disk_free_limit:
        type: integer
      mem_limit:
        type: integer
      mem_used:
        type: integer
      name:
        type: string
    type: object
  models.NotificationResponse:
    properties:
      notifications:
        $ref: '#/definitions/models.VhostNotification'
      vhost:
        $ref: '#/definitions/models.Vhost'
    type: object
  models.QueueDetail:
    properties:
      consumers:
        type: integer
      deliver_rate:
        type: number
      history:
        items:
          type: integer
        type: array
      message_bytes:
        type: integer
      messages:
        type: integer
      messages_unacknowledged:
        type: integer
      name:
        type: string
      publish_rate:
        type: number
      redeliver_rate:
        type: number
    type: object
  models.Recipient:
    properties:
      id:
        type: string
      name:
        type: string
      type:
        $ref: '#/definitions/models.RecipientType'
      url:
        type: string
    type: object
  models.RecipientType:
    enum:
    - slack
    - teams
    - webhook
    - unknown
    type: string
    x-enum-varnames:
    - Slack
    - Teams
    - Webhook
    - RecipientTypeUnknown
  models.TestNotificationResponse:
    properties:
      message:
        type: string
      success:
        type: boolean
    type: object
  models.UpdateMaintenance:
    properties:
      status:
        $ref: '#/definitions/models.MaintenanceStatus'
    type: object
  models.Vhost:
    properties:
      cluster_state:
        additionalProperties:
          type: string
        type: object
      default_queue_type:
        type: string
      description:
        type: string
      messages:
        type: integer
      messages_details:
        $ref: '#/definitions/models.MessageRate'
      messages_ready:
        type: integer
      messages_ready_details:
        $ref: '#/definitions/models.MessageRate'
      messages_unacknowledged:
        type: integer
      messages_unacknowledged_details:
        $ref: '#/definitions/models.MessageRate'
      metadata:
        $ref: '#/definitions/models.Metadata'
      name:
        type: string
      protected_from_deletion:
        type: boolean
      tags:
        items:
          type: string
        type: array
      tracing:
        type: boolean
    type: object
  models.VhostMetrics:
    properties:
      channels:
        type: integer
      connections:
        type: integer
      name:
        type: string
      queues:
        type: integer
      unacked:
        type: integer
    type: object
  models.VhostNotification:
    properties:
      name:
        type: string
      notified:
        type: boolean
      recipients:
        items:
          $ref: '#/definitions/models.Recipient'
        type: array
      rules:
        items:
          $ref: '#/definitions/models.AlarmRule'
        type: array
    type: object
  models.VhostResources:
    properties:
      disk_bytes:
        type: integer
      message_bytes:
        type: integer
      name:
        type: string
    type: object
info:
  contact: {}
paths:
  /v1/cluster:
    get:
      description: Get overall cluster statistics and health information
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ClusterStats'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Get Cluster Stats
      tags:
      - Cluster
  /v1/maintenance:
    get:
      description: Get scheduled  maintenance information and history
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MaintenanceResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Get scheduled  maintenance information and history
      tags:
      - Maintenance
    post:
      description: Add new maintenance entry with description, start time, and end
        time
      parameters:
      - description: Maintenance Entry Data
        in: body
        name: entry
        required: true
        schema:
          $ref: '#/definitions/models.MaintenanceEntry'
      produces:
      - application/json
      responses:
        "303":
          description: Redirect to maintenance admin page with success message
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Add new maintenance entry
      tags:
      - Maintenance
  /v1/maintenance/{maintenance}:
    delete:
      description: Delete a specific maintenance entry by ID
      parameters:
      - description: Maintenance Entry ID
        in: path
        name: maintenance
        required: true
        type: string
      responses:
        "303":
          description: Redirect to maintenance admin page with success message
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Delete a maintenance entry
      tags:
      - Maintenance
  /v1/maintenance/{maintenance}/status:
    put:
      consumes:
      - application/json
      description: Update the status of a maintenance entry (e.g., scheduled, in-progress,
        completed)
      parameters:
      - description: Maintenance Entry ID
        in: path
        name: maintenance
        required: true
        type: string
      - description: Updated Maintenance Status
        in: body
        name: status
        required: true
        schema:
          $ref: '#/definitions/models.UpdateMaintenance'
      produces:
      - application/json
      responses:
        "303":
          description: Redirect to maintenance admin page with success message
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Update maintenance entry status
      tags:
      - Maintenance
  /v1/maintenance/admin:
    get:
      description: Get all maintenance entries for admin view
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MaintenanceAdminResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Get all maintenance entries
      tags:
      - Maintenance
  /v1/notifications/{vhost}:
    get:
      description: Get notification rules and settings for a specific vhost
      parameters:
      - description: Vhost Name
        in: path
        name: vhost
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.NotificationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Get Notifications
      tags:
      - Notifications
  /v1/notifications/{vhost}/logs:
    get:
      description: Fetch logs of notifications sent for a specific vhost, including
        timestamps and message details
      parameters:
      - description: Vhost Name
        in: path
        name: vhost
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of notification log entries
          schema:
            items:
              $ref: '#/definitions/models.VhostNotification'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Get Notification Logs
      tags:
      - Notifications
  /v1/notifications/{vhost}/recipients:
    post:
      consumes:
      - application/json
      description: Add a new notification recipient for a specific vhost
      parameters:
      - description: Vhost Name
        in: path
        name: vhost
        required: true
        type: string
      - description: Notification Recipient Object
        in: body
        name: recipient
        required: true
        schema:
          $ref: '#/definitions/models.Recipient'
      produces:
      - application/json
      responses:
        "303":
          description: Redirect to notifications page
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Add a new notification recipient
      tags:
      - Notifications
  /v1/notifications/{vhost}/recipients/{recipient}:
    delete:
      description: Delete a specific notification recipient for a vhost
      parameters:
      - description: Vhost Name
        in: path
        name: vhost
        required: true
        type: string
      - description: Recipient ID
        in: path
        name: recipient
        required: true
        type: string
      responses:
        "303":
          description: Redirect to notifications page
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Delete a notification recipient
      tags:
      - Notifications
  /v1/notifications/{vhost}/rules:
    post:
      consumes:
      - application/json
      description: Add a new notification rule for a specific vhost
      parameters:
      - description: Vhost Name
        in: path
        name: vhost
        required: true
        type: string
      - description: Notification Rule Object
        in: body
        name: rule
        required: true
        schema:
          $ref: '#/definitions/models.AlarmRule'
      produces:
      - application/json
      responses:
        "303":
          description: Redirect to notifications page
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Add a new notification rule
      tags:
      - Notifications
  /v1/notifications/{vhost}/rules/{recipient}:
    delete:
      description: Delete a specific notification rule for a vhost
      parameters:
      - description: Vhost Name
        in: path
        name: vhost
        required: true
        type: string
      - description: Notification Rule ID
        in: path
        name: recipient
        required: true
        type: string
      responses:
        "303":
          description: Redirect to notifications page
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Delete a notification rule
      tags:
      - Notifications
  /v1/notifications/{vhost}/rules/{rule}:
    put:
      description: Delete a specific notification rule for a vhost
      parameters:
      - description: Vhost Name
        in: path
        name: vhost
        required: true
        type: string
      - description: Notification Rule ID
        in: path
        name: recipient
        required: true
        type: string
      - description: Updated Notification Rule Object
        in: body
        name: rule
        required: true
        schema:
          $ref: '#/definitions/models.AlarmRuleUpdate'
      responses:
        "200":
          description: Rule updated successfully
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Delete a notification rule
      tags:
      - Notifications
  /v1/notifications/{vhost}/rules/{rule}/message:
    post:
      description: Update the custom message template for a specific notification
        rule
      parameters:
      - description: Vhost Name
        in: path
        name: vhost
        required: true
        type: string
      - description: Notification Rule ID
        in: path
        name: rule
        required: true
        type: string
      - description: New Message Template
        in: formData
        name: message
        required: true
        type: string
      produces:
      - application/json
      responses:
        "303":
          description: Redirect to notification rule page with success message
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Update Notification Rule Message
      tags:
      - Notifications
  /v1/notifications/{vhost}/rules/{rule}/test:
    post:
      description: Send a test notification using the specified rule to verify its
        configuration
      parameters:
      - description: Vhost Name
        in: path
        name: vhost
        required: true
        type: string
      - description: Notification Rule ID
        in: path
        name: rule
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Test notification sent successfully
          schema:
            $ref: '#/definitions/models.TestNotificationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Test Notification Rule
      tags:
      - Notifications
  /v1/notifications/{vhost}/rules/{rule}/toggle:
    post:
      description: Enable or disable a specific notification rule for a vhost
      parameters:
      - description: Vhost Name
        in: path
        name: vhost
        required: true
        type: string
      - description: Notification Rule ID
        in: path
        name: rule
        required: true
        type: string
      responses:
        "303":
          description: Redirect to notifications page
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Toggle a notification rule
      tags:
      - Notifications
  /v1/vhosts:
    get:
      description: Get a list of all vhosts in the RabbitMQ cluster
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              items:
                $ref: '#/definitions/models.Vhost'
              type: array
            type: array
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Get all vhosts
      tags:
      - Vhosts
  /v1/vhosts/{vhost}:
    get:
      description: Get details of a specific vhost by name
      parameters:
      - description: Vhost Name
        in: path
        name: vhost
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Vhost'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Get vhost details
      tags:
      - Vhosts
  /v1/vhosts/{vhost}/metrics:
    get:
      description: Get real-time metrics for a specific vhost, including queue lengths,
        message rates, and resource usage
      parameters:
      - description: Vhost Name
        in: path
        name: vhost
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.VhostMetrics'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Get Vhost Metrics
      tags:
      - Metrics
  /v1/vhosts/{vhost}/queues:
    get:
      description: Fetches time-series metrics for a specific RabbitMQ queue over
        a specified time range.
      parameters:
      - description: Virtual Host
        in: query
        name: vhost
        required: true
        type: string
      - description: Queue Name
        in: query
        name: name
        required: true
        type: string
      - default: 1h
        description: Time Range (e.g., 1h, 24h, 7d)
        in: query
        name: range
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: HTML page with queue metrics
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Get Queue Metrics for a specific queue in the specified virtual host
      tags:
      - Metrics
  /v1/vhosts/{vhost}/queues/{queue}:
    get:
      description: Fetches details of all queues in a specified virtual host.
      parameters:
      - description: Virtual Host
        in: query
        name: vhost
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of queue details
          schema:
            items:
              $ref: '#/definitions/models.QueueDetail'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Get All Queues to a specified virtual host
      tags:
      - Queues
swagger: "2.0"
