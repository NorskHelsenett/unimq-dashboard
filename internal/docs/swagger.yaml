basePath: /api
definitions:
  httpsuite.APIError:
    properties:
      error:
        type: string
    type: object
  models.AlarmEntry:
    properties:
      alarmID:
        type: string
      entries:
        items:
          $ref: '#/definitions/models.LogEntry'
        type: array
    type: object
  models.AlarmRule:
    properties:
      enabled:
        type: boolean
      id:
        type: string
      last_fired:
        type: string
      last_value:
        type: number
      message:
        type: string
      name:
        type: string
      queue_name:
        type: string
      status:
        $ref: '#/definitions/models.AlarmStatus'
      threshold:
        type: number
      type:
        $ref: '#/definitions/models.AlarmType'
    type: object
  models.AlarmRuleUpdate:
    properties:
      message:
        example: Queue size has exceeded the threshold
        type: string
      threshold:
        example: 1000
        type: number
    type: object
  models.AlarmStatus:
    enum:
    - ok
    - active
    - inactive
    - firing
    - fired
    - unknown
    type: string
    x-enum-varnames:
    - OK
    - Active
    - Inactive
    - Firing
    - Fired
    - AlarmStatusUnknown
  models.AlarmType:
    enum:
    - channels
    - connections
    - queues
    - unacked
    - queue_messages
    - queue_size
    - no_consumer
    - maintenance
    type: string
    x-enum-varnames:
    - Channels
    - Connections
    - Queues
    - Unacked_Messages
    - Queue_Messages
    - Queue_Size
    - No_Consumer
    - Maintenance
  models.ClusterStats:
    properties:
      min_disk_limit:
        type: integer
      nodes:
        items:
          $ref: '#/definitions/models.NodeStats'
        type: array
      total_disk_free:
        type: integer
      total_mem_limit:
        type: integer
      total_mem_used:
        type: integer
      vhost_resources:
        items:
          $ref: '#/definitions/models.VhostResources'
        type: array
    type: object
  models.LogEntry:
    properties:
      alarm_type:
        $ref: '#/definitions/models.AlarmType'
      event:
        $ref: '#/definitions/models.LogEvent'
      id:
        type: string
      threshold:
        type: number
      ts:
        type: string
      value:
        type: number
    type: object
  models.LogEvent:
    enum:
    - fired
    - resolved
    type: string
    x-enum-varnames:
    - LogEventFired
    - LogEventResolved
  models.MaintenanceAdminResponse:
    properties:
      entries:
        items:
          $ref: '#/definitions/models.MaintenanceEntry'
        type: array
    type: object
  models.MaintenanceEditLog:
    properties:
      description:
        type: string
      end:
        type: string
      id:
        type: string
      maintenance_id:
        type: string
      reason:
        type: string
      start:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
    type: object
  models.MaintenanceEntry:
    properties:
      description:
        example: maintenance for server upgrade
        type: string
      end:
        example: "2024-06-01 12:00:00"
        type: string
      id:
        example: ""
        type: string
      notified:
        type: boolean
      start:
        example: "2024-06-01 10:00:00"
        type: string
      status:
        allOf:
        - $ref: '#/definitions/models.MaintenanceStatus'
        example: '-'
      update_reason:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
    type: object
  models.MaintenanceResponse:
    properties:
      history:
        items:
          $ref: '#/definitions/models.MaintenanceEntry'
        type: array
      scheduled:
        items:
          $ref: '#/definitions/models.MaintenanceEntry'
        type: array
    type: object
  models.MaintenanceStatus:
    enum:
    - scheduled
    - done
    - skipped
    - unknown
    type: string
    x-enum-varnames:
    - MaintenanceStatusScheduled
    - MaintenanceStatusDone
    - MaintenanceStatusSkipped
    - MaintenanceStatusUnknown
  models.MessageRate:
    properties:
      rate:
        type: number
    type: object
  models.MessageStats:
    properties:
      deliver_get_details:
        $ref: '#/definitions/models.RateDetail'
      publish_details:
        $ref: '#/definitions/models.RateDetail'
      redeliver_details:
        $ref: '#/definitions/models.RateDetail'
    type: object
  models.Metadata:
    properties:
      default_queue_type:
        type: string
      description:
        type: string
      tags:
        items:
          type: string
        type: array
    type: object
  models.NodeStats:
    properties:
      disk_free:
        type: integer
      disk_free_limit:
        type: integer
      mem_limit:
        type: integer
      mem_used:
        type: integer
      name:
        type: string
    type: object
  models.PatchMaintenanceEntry:
    properties:
      description:
        type: string
      end:
        type: string
      reason:
        type: string
      start:
        type: string
      updated_by:
        type: string
    type: object
  models.PostAlarmRule:
    properties:
      enabled:
        example: true
        type: boolean
      message:
        example: Queue size has exceeded the threshold
        type: string
      name:
        example: High Queue Size
        type: string
      queue_name:
        example: my-queue
        type: string
      threshold:
        example: 1000
        type: number
      type:
        allOf:
        - $ref: '#/definitions/models.AlarmType'
        example: queue_size
    type: object
  models.PostMaintenanceEntry:
    properties:
      description:
        example: maintenance for server upgrade
        type: string
      end:
        example: "2024-06-01 12:00:00"
        type: string
      start:
        example: "2024-06-01 10:00:00"
        type: string
    type: object
  models.PostRecipient:
    properties:
      email:
        example: ola.normann@normann.no
        type: string
      name:
        example: Slack Channel to team
        type: string
      type:
        allOf:
        - $ref: '#/definitions/models.RecipientType'
        example: webhook
      url:
        example: https://hooks.slack.com/services
        type: string
    type: object
  models.QueueAPIResponse:
    properties:
      consumers:
        type: integer
      message_bytes:
        type: integer
      message_bytes_persistent:
        type: integer
      message_stats:
        $ref: '#/definitions/models.MessageStats'
      messages:
        type: integer
      messages_unacknowledged:
        type: integer
      name:
        type: string
      vhost:
        type: string
    type: object
  models.QueueDetail:
    properties:
      consumers:
        type: integer
      deliver_rate:
        type: number
      history:
        items:
          type: integer
        type: array
      message_bytes:
        type: integer
      messages:
        type: integer
      messages_unacknowledged:
        type: integer
      name:
        type: string
      publish_rate:
        type: number
      redeliver_rate:
        type: number
    type: object
  models.RateDetail:
    properties:
      rate:
        type: number
    type: object
  models.Recipient:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      type:
        $ref: '#/definitions/models.RecipientType'
      url:
        type: string
    type: object
  models.RecipientType:
    enum:
    - webhook
    - email
    - unknown
    type: string
    x-enum-varnames:
    - Webhook
    - Email
    - RecipientTypeUnknown
  models.TestNotificationResponse:
    properties:
      message:
        type: string
      success:
        type: boolean
    type: object
  models.UpdateMaintenance:
    description: Update the status of a maintenance entry (scheduled, done, skipped)
    properties:
      status:
        allOf:
        - $ref: '#/definitions/models.MaintenanceStatus'
        description: Enums - scheduled, done, skipped
    type: object
  models.Vhost:
    properties:
      cluster_state:
        additionalProperties:
          type: string
        type: object
      default_queue_type:
        type: string
      description:
        type: string
      messages:
        type: integer
      messages_details:
        $ref: '#/definitions/models.MessageRate'
      messages_ready:
        type: integer
      messages_ready_details:
        $ref: '#/definitions/models.MessageRate'
      messages_unacknowledged:
        type: integer
      messages_unacknowledged_details:
        $ref: '#/definitions/models.MessageRate'
      metadata:
        $ref: '#/definitions/models.Metadata'
      name:
        type: string
      protected_from_deletion:
        type: boolean
      tags:
        items:
          type: string
        type: array
      tracing:
        type: boolean
    type: object
  models.VhostMetrics:
    properties:
      channels:
        type: integer
      connections:
        type: integer
      name:
        type: string
      queues:
        type: integer
      unacked:
        type: integer
    type: object
  models.VhostNotification:
    properties:
      name:
        type: string
      notified:
        type: boolean
      recipients:
        items:
          $ref: '#/definitions/models.Recipient'
        type: array
      rules:
        items:
          $ref: '#/definitions/models.AlarmRule'
        type: array
    type: object
  models.VhostResources:
    properties:
      disk_bytes:
        type: integer
      message_bytes:
        type: integer
      name:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: Norsk helsenett SF
    url: https://github.com/NorskHelsenett/unimq-dashboard
  description: API for RabbitMQ Dashboard application.
  title: RabbitMQ Dashboard API
  version: "1.0"
paths:
  /v1/alarms:
    get:
      description: Get alarm history for all vhosts
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              items:
                $ref: '#/definitions/models.AlarmEntry'
              type: array
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Get Alarm History
      tags:
      - Alarms
  /v1/alarms/{vhost-name}:
    get:
      description: Get alarm history for a specific vhost
      parameters:
      - description: Vhost Name
        in: path
        name: vhost-name
        required: true
        type: string
      - description: Alarm Type
        enum:
        - channels
        - connections
        - queues
        - unacked
        - queue_messages
        - queue_size
        - no_consumer
        - maintenance
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              items:
                $ref: '#/definitions/models.AlarmEntry'
              type: array
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Get Alarm History for Vhost
      tags:
      - Alarms
  /v1/cluster:
    get:
      description: Get overall cluster statistics and health information
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ClusterStats'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Get Cluster Stats
      tags:
      - Cluster
  /v1/maintenance:
    get:
      description: Get scheduled  maintenance information and history
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MaintenanceResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Get scheduled  maintenance information and history
      tags:
      - Maintenance
    post:
      description: Add new maintenance entry with description, start time, and end
        time that will have the status Scheduled
      parameters:
      - description: Maintenance Entry Data
        in: body
        name: entry
        required: true
        schema:
          $ref: '#/definitions/models.PostMaintenanceEntry'
      produces:
      - application/json
      responses:
        "201":
          description: Maintenance entry added successfully
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Add new scheduled maintenance entry
      tags:
      - Maintenance
  /v1/maintenance/{maintenance-id}:
    delete:
      description: Delete a specific maintenance entry by ID
      parameters:
      - description: Maintenance Entry ID
        in: path
        name: maintenance-id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Maintenance entry deleted successfully
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Delete a maintenance entry
      tags:
      - Maintenance
    patch:
      consumes:
      - application/json
      description: Edit description, start, and end of an existing maintenance entry,
        with an audit trail
      parameters:
      - description: Maintenance Entry ID
        in: path
        name: maintenance-id
        required: true
        type: string
      - description: Updated Maintenance Data
        in: body
        name: entry
        required: true
        schema:
          $ref: '#/definitions/models.PatchMaintenanceEntry'
      produces:
      - application/json
      responses:
        "200":
          description: Maintenance entry updated successfully
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Edit a maintenance entry
      tags:
      - Maintenance
    put:
      consumes:
      - application/json
      description: Update the status of a maintenance entry (e.g., scheduled, in-progress,
        completed)
      parameters:
      - description: Maintenance Entry ID
        in: path
        name: maintenance-id
        required: true
        type: string
      - description: New Maintenance Status
        in: body
        name: status
        required: true
        schema:
          $ref: '#/definitions/models.UpdateMaintenance'
      produces:
      - application/json
      responses:
        "200":
          description: Maintenance status updated successfully
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Update maintenance entry status
      tags:
      - Maintenance
  /v1/maintenance/{maintenance-id}/logs:
    get:
      description: Returns all edit log entries for a given maintenance ID
      parameters:
      - description: Maintenance Entry ID
        in: path
        name: maintenance-id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.MaintenanceEditLog'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Get edit history for a maintenance entry
      tags:
      - Maintenance
  /v1/maintenance/admin:
    get:
      description: Get all maintenance entries for admin view
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MaintenanceAdminResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Get all maintenance entries
      tags:
      - Maintenance
  /v1/notifications:
    get:
      description: Get all notification vhosts and settings
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.VhostNotification'
            type: array
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Get Notifications
      tags:
      - Notifications
  /v1/notifications/{vhost-name}:
    delete:
      description: Deletes the notification configuration for a specific vhost
      parameters:
      - description: Vhost Name
        in: path
        name: vhost-name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Delete Notifications
      tags:
      - Notifications
    get:
      description: Get notification rules and settings for a specific vhost
      parameters:
      - description: Vhost Name
        in: path
        name: vhost-name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.VhostNotification'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Get Notification on Vhost
      tags:
      - Notifications
  /v1/notifications/{vhost-name}/recipients:
    post:
      consumes:
      - application/json
      description: Add a new notification recipient for a specific vhost
      parameters:
      - description: Vhost Name
        in: path
        name: vhost-name
        required: true
        type: string
      - description: Notification Recipient Object
        in: body
        name: recipient
        required: true
        schema:
          $ref: '#/definitions/models.PostRecipient'
      produces:
      - application/json
      responses:
        "201":
          description: Recipient added successfully
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Add a new notification recipient
      tags:
      - Notifications
  /v1/notifications/{vhost-name}/recipients/{recipient-id}:
    delete:
      description: Delete a specific notification recipient for a vhost
      parameters:
      - description: Vhost Name
        in: path
        name: vhost-name
        required: true
        type: string
      - description: Recipient ID
        in: path
        name: recipient-id
        required: true
        type: string
      responses:
        "200":
          description: Recipient deleted successfully
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Delete a notification recipient
      tags:
      - Notifications
  /v1/notifications/{vhost-name}/rules:
    post:
      consumes:
      - application/json
      description: Add a new notification rule for a specific vhost
      parameters:
      - description: Vhost Name
        in: path
        name: vhost-name
        required: true
        type: string
      - description: Notification Rule Object
        in: body
        name: rule
        required: true
        schema:
          $ref: '#/definitions/models.PostAlarmRule'
      produces:
      - application/json
      responses:
        "201":
          description: Rule added successfully
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Add a new notification rule
      tags:
      - Notifications
  /v1/notifications/{vhost-name}/rules/{rule-id}:
    delete:
      description: Delete a specific notification rule for a vhost
      parameters:
      - description: Vhost Name
        in: path
        name: vhost-name
        required: true
        type: string
      - description: Notification Rule ID
        in: path
        name: rule-id
        required: true
        type: string
      responses:
        "200":
          description: Rule deleted successfully
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Delete a notification rule
      tags:
      - Notifications
    post:
      description: Delete a specific notification rule for a vhost
      parameters:
      - description: Vhost Name
        in: path
        name: vhost-name
        required: true
        type: string
      - description: Notification Rule ID
        in: path
        name: rule-id
        required: true
        type: string
      - description: Updated Notification Rule Object
        in: body
        name: rule
        required: true
        schema:
          $ref: '#/definitions/models.AlarmRuleUpdate'
      responses:
        "200":
          description: Rule updated successfully
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Update a notification rule
      tags:
      - Notifications
  /v1/notifications/{vhost-name}/rules/{rule-id}/test:
    post:
      description: Send a test notification using the specified rule to verify its
        configuration
      parameters:
      - description: Vhost Name
        in: path
        name: vhost-name
        required: true
        type: string
      - description: Notification Rule ID
        in: path
        name: rule-id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Test notification sent successfully
          schema:
            $ref: '#/definitions/models.TestNotificationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Test Notification Rule
      tags:
      - Notifications
  /v1/notifications/{vhost-name}/rules/{rule-id}/toggle:
    post:
      description: Enable or disable a specific notification rule for a vhost
      parameters:
      - description: Vhost Name
        in: path
        name: vhost-name
        required: true
        type: string
      - description: Notification Rule ID
        in: path
        name: rule-id
        required: true
        type: string
      responses:
        "200":
          description: Rule toggled successfully
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpsuite.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpsuite.APIError'
      summary: Toggle a notification rule
      tags:
      - Notifications
  /v1/vhosts:
    get:
      description: Get a list of all vhosts in the RabbitMQ cluster
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              items:
                $ref: '#/definitions/models.Vhost'
              type: array
            type: array
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/httpsuite.APIError'
