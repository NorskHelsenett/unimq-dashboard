# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  NAME: unimq-dashboard
  GO: go
  GOFMT: gofmt
  MAIN_PATH: ./cmd/unimq
  GENERATOR_PATH: ./cmd/generator
  GO_VERSION: $(shell go version | cut -d' ' -f3)

  GOLANGCI_LINT: golangci-lint
  GOLANGCI_LINT_VERSION: latest

  # Pinned to the version in go.mod so local runs and CI generate byte-identical
  # output. An unpinned swag makes the swag-verify check fail on version skew
  # rather than on real drift.
  SWAG_VERSION:
    sh: go list -m github.com/swaggo/swag | awk '{print $2}'

  LOCALBIN: $(shell pwd)/bin

tasks:
  default:
    deps:
      - check-go-installed
    desc: Print the Go version
    cmds:
      - go version
    silent: true

  vet:
    deps:
      - check-go-installed
    desc: Run go vet on the project
    cmds:
      - go vet ./...
    silent: true

  test:
    deps:
      - check-go-installed
    desc: Run tests on the project
    cmds:
      - go test ./...
    silent: true

  lint:
    desc: Run golangci-lint on the project
    cmds:
      - "{{.GOLANGCI_LINT}} run --timeout 5m"
    silent: true

  upgrade-lint:
    desc: Upgrade golangci-lint to the latest version
    cmds:
      - go install github.com/golangci/golangci-lint/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
    silent: true

  upgrade-mod:
    deps:
      - check-go-installed
    desc: Upgrade Go modules to the latest versions
    cmds:
      - go get -u ./...
      - go mod tidy
    silent: true

  generator:
    deps:
      - check-go-installed
    desc: Run the generator tool
    cmds:
      - go run {{.GENERATOR_PATH}}/main.go
    silent: true

  run:
    deps:
      - check-go-installed
    desc: Start the application
    cmds:
      - go run {{.MAIN_PATH}}/main.go
    silent: true

  build:
    deps:
      - check-go-installed
    desc: Build the application
    cmds:
      - CGO_ENABLED=0 go build -o dist/{{.NAME}} -ldflags "-w -extldflags '-static'" {{.MAIN_PATH}}/
    silent: true

  swag-check:
    desc: Install the swag CLI at the version pinned in go.mod
    cmds:
      - go install github.com/swaggo/swag/cmd/swag@{{.SWAG_VERSION}}
    silent: true

  swag:
    desc: Generate and format Swagger documentation
    cmds:
      - task: swag-check
      - task: swag-format
      - task: swag-generate
    silent: true

  swag-verify:
    desc: Fail if the committed Swagger documentation is out of date
    cmds:
      - task: swag-check
      - task: swag-generate
      - bash -c '
          if [ -n "$(git status --porcelain -- internal/docs)" ]; then
            echo "Swagger documentation is out of date. Run '\''task go:swag'\'' and commit the result." >&2;
            git --no-pager diff --stat -- internal/docs >&2;
            exit 1;
          fi;
          echo "Swagger documentation is up to date."'
    silent: true

  swag-generate:
    desc: Generate Swagger documentation
    deps:
      - swag-check
    cmds:
      - swag init -g {{.MAIN_PATH}}/main.go -o ./internal/docs --parseInternal
    silent: true

  swag-format:
    desc: Format Swagger documentation
    deps:
      - swag-check
    cmds:
      - swag fmt -d .
    silent: true

  check-go-installed:
    desc: Check if Go is installed
    cmds:
      - bash -c 'command -v go >/dev/null 2>&1 || { echo >&2 "Go is not installed. Please install Go to proceed."; exit 1; }'
    silent: true

  check-golangci-lint-installed:
    desc: Check if golangci-lint is installed
    cmds:
      - bash -c 'command -v golangci-lint >/dev/null 2>&1 || { echo >&2 "golangci-lint is not installed. Please install golangci-lint to proceed."; exit 1; }'
    silent: true

  check-swag-installed:
    desc: Check if swag is installed
    cmds:
      - bash -c 'command -v swag >/dev/null 2>&1 || { echo >&2 "swag is not installed. Please install swag to proceed."; exit 1; }'
    silent: true
