# The base path of dex and the external name of the OpenID Connect service.
# This is the canonical URL that all clients MUST use to refer to dex. If a
# path is provided, dex's HTTP service will listen at a non-root URL.
# issuer: https://auth.sky.nhn.no/dex
issuer: http://localhost:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556
  allowedOrigins:
    - https://127.0.0.1:8080
    - http://localhost:8080
    - http://localhost:5173
    - https://unimq.test.nhn.no
  allowedHeaders:
    - Content-Type
    - Authorization
    - X-Requested-With

oauth2:
  skipApprovalScreen: true

enablePasswordDB: true

expiry:
  idTokens: 1h
  refreshTokens:
    validIfNotUsedFor: 1h
    absoluteLifetime: 8h

staticClients:
  - id: unimq-dashboard
    name: Unimq Dashboard
    secret: O8jad9kl1PD1er
    redirectURIs:
      - http://localhost:8080/api/v1/login/callback
      - https://unimq.test.nhn.no/api/v1/login/callback
    scopes:
      - email
      - profile
      - groups
    trustedPeers:
      - unimq-swagger

  - id: unimq-swagger
    name: Unimq Swagger UI
    public: true
    redirectURIs:
      - http://localhost:8080/api/swagger/oauth2-redirect.html
      - https://unimq.test.nhn.no/api/swagger/oauth2-redirect.html

staticPasswords:
  - email: olanordmann@test.com
    username: Ola Nordmann
    userID: "123"
    # password
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    groups:
      - group.name1@local
