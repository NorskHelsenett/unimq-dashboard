    <script>
        const currentVhost = {{.Selected }};

        function selectVhost(vhost) {
            window.location.href = '/?vhost=' + encodeURIComponent(vhost);
        }

        function fmtBytes(b) {
            if (b >= 1073741824) return (b / 1073741824).toFixed(1) + ' GB';
            if (b >= 1048576) return (b / 1048576).toFixed(1) + ' MB';
            if (b >= 1024) return (b / 1024).toFixed(1) + ' KB';
            return b + ' B';
        }

        function fmtRate(r) {
            if (r === 0) return '<span class="zero">0</span>';
            return r.toFixed(2) + '/s';
        }

        function sparkline(data) {
            if (!data || data.length < 2) return '';
            const w = 64, h = 24, pad = 2;
            const min = 0;
            const max = Math.max(...data, 1);
            const range = max - min;
            const points = data.map((v, i) => {
                const x = pad + (i / (data.length - 1)) * (w - pad * 2);
                const y = (h - pad) - ((v - min) / range) * (h - pad * 2);
                return `${x.toFixed(1)},${y.toFixed(1)}`;
            }).join(' ');
            const hasChange = Math.max(...data) !== Math.min(...data);
            const color = hasChange ? '#FF8C00' : '#FFD08C';
            return `<svg width="${w}" height="${h}" style="vertical-align:middle;display:block">
                <polyline points="${points}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>`;
        }

        function drawGauge(canvasId, title, pct, centerLabel, subLabel) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const dpr = window.devicePixelRatio || 1;
            const W = 200, H = 130;
            canvas.width = W * dpr;
            canvas.height = H * dpr;
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);

            const cx = W / 2, cy = H - 22;
            const r = 68;
            const lw = 14;
            const startA = Math.PI;          // left
            const endA = 2 * Math.PI;      // right
            const fillA = startA + pct * Math.PI;

            // Light background
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.roundRect(0, 0, W, H, 8);
            ctx.fill();

            // Track
            ctx.beginPath();
            ctx.arc(cx, cy, r, startA, endA);
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = lw;
            ctx.lineCap = 'round';
            ctx.stroke();

            // Tick marks at 0%, 50%, 100%
            [0, 0.5, 1].forEach(t => {
                const a = startA + t * Math.PI;
                const x1 = cx + (r - lw) * Math.cos(a);
                const y1 = cy + (r - lw) * Math.sin(a);
                const x2 = cx + (r + 2) * Math.cos(a);
                const y2 = cy + (r + 2) * Math.sin(a);
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = '#ccc';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            });

            // Colored fill arc
            if (pct > 0) {
                // Gradient: green → orange → red
                const grad = ctx.createLinearGradient(
                    cx - r, cy, cx + r, cy
                );
                grad.addColorStop(0, '#4caf50');
                grad.addColorStop(0.6, '#ff9800');
                grad.addColorStop(1, '#f44336');

                ctx.beginPath();
                ctx.arc(cx, cy, r, startA, fillA);
                ctx.strokeStyle = grad;
                ctx.lineWidth = lw;
                ctx.lineCap = 'round';
                ctx.stroke();

                // Bright dot at tip
                const dotX = cx + r * Math.cos(fillA);
                const dotY = cy + r * Math.sin(fillA);
                ctx.beginPath();
                ctx.arc(dotX, dotY, lw / 2 - 1, 0, 2 * Math.PI);
                ctx.fillStyle = pct > 0.8 ? '#f44336' : pct > 0.6 ? '#ff9800' : '#4caf50';
                ctx.fill();
            }

            // Center percentage
            const pctColor = pct > 0.8 ? '#f44336' : pct > 0.6 ? '#ff9800' : '#4caf50';
            ctx.fillStyle = pctColor;
            ctx.font = `bold ${pct >= 0.1 ? 22 : 20}px -apple-system, sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText((pct * 100).toFixed(1) + '%', cx, cy - 8);

            // Sub label (used / limit)
            ctx.fillStyle = '#888';
            ctx.font = '10px -apple-system, sans-serif';
            ctx.fillText(subLabel, cx, cy + 8);

            // Title
            ctx.fillStyle = '#444';
            ctx.font = '12px -apple-system, sans-serif';
            ctx.fillText(title, cx, 16);
        }

        function fetchCluster() {
            fetch('/api/cluster')
                .then(r => r.json())
                .then(d => {
                    const memPct = d.total_mem_limit > 0
                        ? d.total_mem_used / d.total_mem_limit : 0;
                    drawGauge('mem-gauge', 'Memory',
                        memPct,
                        (memPct * 100).toFixed(1) + '%',
                        fmtBytes(d.total_mem_used) + ' / ' + fmtBytes(d.total_mem_limit));

                    // Disk: how close is free space to the alarm limit
                    const diskPct = d.total_disk_free > 0
                        ? d.min_disk_limit / d.total_disk_free : 0;
                    drawGauge('disk-gauge', 'Disk',
                        Math.min(diskPct, 1),
                        (diskPct * 100).toFixed(1) + '%',
                        fmtBytes(d.total_disk_free) + ' ledig');

                    // Per-vhost message data for selected vhost only
                    const vr = (d.vhost_resources || []).find(v => v.name === currentVhost);
                    if (vr) {
                        document.getElementById('vhost-mem-val').textContent = fmtBytes(vr.message_bytes);
                        document.getElementById('vhost-disk-val').textContent = fmtBytes(vr.disk_bytes);
                    } else {
                        document.getElementById('vhost-mem-val').textContent = '0 B';
                        document.getElementById('vhost-disk-val').textContent = '0 B';
                    }
                })
                .catch(() => { });
        }

        const bucketLabels = ['0–100B', '100–500B', '500B–1KB', '1–5KB', '5–10KB', '10–50KB', '50–100KB', '100–500KB', '500KB–1MB'];
        const bucketColors = ['#43a047', '#43a047', '#8bc34a', '#c9a800', '#c9a800', '#FF8C00', '#FF8C00', '#e53935', '#e53935'];
        const bucketLimits = [100, 500, 1024, 5120, 10240, 51200, 102400, 512000, 1048576];

        function getBucket(avgSize) {
            for (let i = 0; i < bucketLimits.length - 1; i++) {
                if (avgSize < bucketLimits[i]) return i;
            }
            return 8;
        }

        function fmtAvgSize(b) {
            if (b <= 0) return '—';
            if (b >= 1048576) return `<span class="size-num">${(b / 1048576).toFixed(1)}</span> <span class="size-unit">MiB</span>`;
            if (b >= 1024) return `<span class="size-num">${(b / 1024).toFixed(1)}</span> <span class="size-unit">KiB</span>`;
            return `<span class="size-num">${Math.round(b)}</span> <span class="size-unit">B</span>`;
        }

        function updateSizeDist(queues) {
            const section = document.getElementById('size-dist-section');
            if (!section) return;

            const counts = [0, 0, 0, 0, 0, 0, 0, 0, 0];
            let totalMessages = 0, totalBytes = 0;

            for (const q of queues) {
                if (!q.messages || q.messages <= 0) continue;
                const bytes = q.message_bytes || 0;
                totalMessages += q.messages;
                totalBytes += bytes;
                const avgSize = bytes / q.messages;
                if (avgSize <= bucketLimits[4]) {
                    counts[getBucket(avgSize)] += q.messages;
                }
            }

            if (totalMessages === 0) { section.style.display = 'none'; return; }
            section.style.display = '';

            const avgBytes = totalBytes / totalMessages;
            document.getElementById('size-avg-value').innerHTML = fmtAvgSize(avgBytes);

            const pcts = counts.map(c => totalMessages > 0 ? c / totalMessages * 100 : 0);
            const maxPct = Math.max(...pcts, 0.1);

            document.getElementById('size-dist-bars').innerHTML = pcts.map((pct, i) => {
                const barH = Math.round((pct / maxPct) * 60);
                const color = bucketColors[i];
                return `<div class="size-bucket">
                    <div class="bucket-pct" style="color:${color}">${pct.toFixed(1)}%</div>
                    <div class="bucket-bar-wrap">
                        <div class="bucket-bar" style="height:${barH}px;background:${color}"></div>
                    </div>
                    <div class="bucket-label">${bucketLabels[i]}</div>
                </div>`;
            }).join('');
        }

        function fetchQueues() {
            if (!currentVhost) return;
            fetch('/api/queues?vhost=' + encodeURIComponent(currentVhost))
                .then(r => r.json())
                .then(queues => {
                    const tbody = document.getElementById('queues-body');
                    if (!queues || queues.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="9" class="empty">Ingen køer på denne vhosten</td></tr>';
                        updateSizeDist([]);
                        return;
                    }
                    tbody.innerHTML = queues.map(q => `
                        <tr>
                            <td class="queue-name"><a href="/queue?vhost=${encodeURIComponent(currentVhost)}&name=${encodeURIComponent(q.name)}">${q.name}</a></td>
                            <td class="msg-count">${q.messages}</td>
                            <td class="sparkline-cell">${sparkline(q.history)}</td>
                            <td class="queue-size">${fmtBytes(q.message_bytes)}</td>
                            <td>${q.messages_unacknowledged}</td>
                            <td>${q.messages > 0 && q.consumers === 0
                            ? '<span class="no-consumer">0 &#9888;</span>'
                            : q.consumers}</td>
                            <td>${fmtRate(q.publish_rate)}</td>
                            <td>${fmtRate(q.deliver_rate)}</td>
                            <td>${fmtRate(q.redeliver_rate)}</td>
                        </tr>`).join('');
                    updateSizeDist(queues);
                })
                .catch(() => {
                    document.getElementById('queues-body').innerHTML =
                        '<tr><td colspan="9" class="error">Kunne ikke hente kødata</td></tr>';
                });
        }

        fetchCluster();
        fetchQueues();
        setInterval(fetchCluster, 15000);
        setInterval(fetchQueues, 10000);
        setTimeout(() => location.reload(), 60000);

        // Info popups for tooltip icons
        let activePopup = null;

        document.querySelectorAll('.tooltip[data-info]').forEach(el => {

                e.stopPropagation();
                if (activePopup) { activePopup.remove(); activePopup = null; }

                const popup = document.createElement('div');
                popup.className = 'info-popup';
                popup.innerHTML = `<span class="info-popup-close">Lukk ✕</span>${el.dataset.info}`;

                document.body.appendChild(popup);
                activePopup = popup;

                // Position near the icon

                    left = rect.left - popupW - 8;
                }
                popup.style.left = Math.max(8, left) + 'px';
                popup.style.top = Math.max(8, rect.top - 8) + 'px';

                popup.querySelector('.info-popup-close').addEventListener('click', () => {
                    popup.remove(); activePopup = null;
                });
            });
        });

        document.addEventListener('click', () => {
            if (activePopup) { activePopup.remove(); activePopup = null; }
        });
    </script>
