<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer circle -->
  <circle cx="24" cy="24" r="21.5" fill="none" stroke="#ff6600" stroke-width="1.5"/>

  <!-- Rabbit 1: upper half, facing right, OUTLINE only -->
  <g transform="translate(26,14) rotate(-10) scale(0.72)" fill="none" stroke="#ff6600" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body -->
    <ellipse cx="1.5" cy="0" rx="9" ry="3.8" stroke-width="1.5"/>
    <!-- Head -->
    <ellipse cx="-8" cy="-0.5" rx="3.4" ry="3" stroke-width="1.5"/>
    <!-- Front ear (closed path = teardrop) -->
    <path d="M-9,-3 C-12.5,-8 -10,-13.5 -7.5,-13.5 C-5,-13.5 -4,-8 -7,-3 Z" stroke-width="1.3"/>
    <!-- Back ear -->
    <path d="M-5.5,-2.5 C-3.5,-9 -1.5,-12.5 0,-12.5 C1.5,-12.5 2.5,-9 0,-2.5 Z" stroke-width="1.3"/>
    <!-- Tail -->
    <circle cx="11" cy="1.5" r="2" stroke-width="1.3"/>
    <!-- Front legs -->
    <path d="M-9,2.5 C-11.5,5.5 -11.5,8.5 -9.5,9.5" stroke-width="1.3"/>
    <path d="M-7,3 C-9,6 -9,9 -7,10" stroke-width="1.3"/>
    <!-- Back legs -->
    <path d="M5,3.8 C7,6.5 9.5,7 10.5,5.5" stroke-width="1.3"/>
    <path d="M7.5,4.2 C9.5,7 11.5,7 12,5.5" stroke-width="1.3"/>
  </g>

  <!-- Rabbit 2: lower half, facing left, SOLID fill -->
  <g transform="translate(22,34) rotate(170) scale(0.72)">
    <!-- Body -->
    <ellipse cx="1.5" cy="0" rx="9" ry="3.8" fill="#ff6600"/>
    <!-- Head -->
    <ellipse cx="-8" cy="-0.5" rx="3.4" ry="3" fill="#ff6600"/>
    <!-- Front ear -->
    <path d="M-9,-3 C-12.5,-8 -10,-13.5 -7.5,-13.5 C-5,-13.5 -4,-8 -7,-3 Z" fill="#ff6600"/>
    <!-- Back ear -->
    <path d="M-5.5,-2.5 C-3.5,-9 -1.5,-12.5 0,-12.5 C1.5,-12.5 2.5,-9 0,-2.5 Z" fill="#ff6600"/>
    <!-- Tail -->
    <circle cx="11" cy="1.5" r="2" fill="#ff6600"/>
    <!-- Front legs (filled ellipses) -->
    <ellipse cx="-10.5" cy="6.5" rx="1.1" ry="3.8" fill="#ff6600" transform="rotate(-8,-10.5,6.5)"/>
    <ellipse cx="-8" cy="7" rx="1.1" ry="3.8" fill="#ff6600" transform="rotate(-4,-8,7)"/>
    <!-- Back legs (filled ellipses) -->
    <ellipse cx="8" cy="6" rx="1.1" ry="3.2" fill="#ff6600" transform="rotate(22,8,6)"/>
    <ellipse cx="10.5" cy="6" rx="1.1" ry="3.2" fill="#ff6600" transform="rotate(28,10.5,6)"/>
  </g>
</svg>
