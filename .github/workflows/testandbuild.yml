name: Test and build unimq-dashboard

on:
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.x"
      - run: npm ci
      - run: npm run lint
      - run: npm run build:github
