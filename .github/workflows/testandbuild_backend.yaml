name: Test and build unimq-dashboard backend

on:
  workflow_dispatch:
  workflow_call:

# For the Golangci-lint job.
permissions:
  contents: read

env:
  APP: unimq-dashboard
  APP_PATH: cmd/unimq
jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Download go modules
        run: |
          go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Build Swagger
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          make docs-run

      - name: Build
        run: |
          echo building...
          mkdir -p dist/isbuilt
          CGO_ENABLED=0 go build -o dist/${{ env.APP }} -ldflags "-w -extldflags '-static'" ./cmd/unimq/
  golangci:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          cache: true
          cache-dependency-path: go.sum
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
