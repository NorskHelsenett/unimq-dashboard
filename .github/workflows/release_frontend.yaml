name: Release unimq-dashboard frontend

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/norskhelsenett/unimq-dashboard/frontend

jobs:
  release-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Show metadata outputs
        run: |
          echo '${{ toJSON(steps.meta.outputs) }}'

      - name: Build and push frontend
        uses: docker/bake-action@v7
        with:
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file-tags }}
            cwd://${{ steps.meta.outputs.bake-file-labels }}
          targets: frontend_release
          push: true
          provenance: true
          sbom: true

      - name: Show bake outputs
        run: |
          echo '${{ toJSON(steps.bake.outputs) }}'

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign frontend image
        run: |
          cosign sign --yes --recursive \
            "${IMAGE}:${{ github.ref_name }}"
