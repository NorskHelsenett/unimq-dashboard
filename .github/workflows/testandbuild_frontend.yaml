name: Test and build unimq-dashboard frontend

on:
  pull_request:
    branches:
      - main
env:
  APP: unimq-dashboard
  APP_PATH: cmd/unimq
jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
