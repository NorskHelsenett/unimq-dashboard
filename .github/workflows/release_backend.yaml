name: Release unimq-dashboard backend

on:
  workflow_call:

permissions:
  contents: read
  packages: write
  id-token: write
  actions: write

concurrency:
  group: release-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/norskhelsenett/unimq-dashboard/backend
  METADATA_TAGS: |
    type=semver,pattern={{version}}
    type=semver,pattern={{major}}.{{minor}}
    type=semver,pattern={{major}}
    type=sha
    type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

jobs:
  build-backend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Prepare
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ env.METADATA_TAGS }}

      - name: Build and push backend by digest
        id: bake
        uses: docker/bake-action@v7
        env:
          PLATFORMS: ${{ matrix.platform }}
          CACHE_SCOPE: ${{ env.PLATFORM_PAIR }}
        with:
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file-labels }}
          targets: backend_release
          provenance: true
          sbom: true
          set: |
            *.output=type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          BAKE_METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          digest="$(jq -er '.backend_release."containerimage.digest"' <<< "$BAKE_METADATA")"
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-backend-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  release-backend:
    needs: [build-backend]
    runs-on: ubuntu-latest

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-backend-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ env.METADATA_TAGS }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046 # word splitting is intended here
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign backend image
        run: |
          cosign sign --yes --recursive \
          "${IMAGE}:${{ steps.meta.outputs.version }}"
