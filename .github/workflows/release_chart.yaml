name: Release unimq-dashboard helm chart

on:
  workflow_call:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: release-chart-${{ github.ref }}
  cancel-in-progress: false

env:
  CHART: oci://ghcr.io/norskhelsenett/charts

jobs:
  release-chart:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Determine chart version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Lint chart
        run: helm lint ./unimq

      - name: Package chart
        run: |
          helm package ./unimq \
            --destination .cr-release-packages \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart
        run: |
          helm push .cr-release-packages/unimq-${{ steps.version.outputs.version }}.tgz "${CHART}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4

      - name: Sign chart
        run: |
          cosign sign --yes \
            "${CHART#oci://}/unimq:${{ steps.version.outputs.version }}"
