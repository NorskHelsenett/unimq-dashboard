name: Release unimq-dashboard helm chart

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: release-chart-${{ github.ref }}
  cancel-in-progress: false

env:
  CHART: oci://ghcr.io/norskhelsenett/charts

jobs:
  release-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5

      - name: Determine chart version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Lint chart
        run: helm lint ./unimq

      - name: Package chart
        run: |
          helm package ./unimq \
            --destination .cr-release-packages \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}"

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart
        id: push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          helm push ".cr-release-packages/unimq-${VERSION}.tgz" "${CHART}" 2>&1 | tee push.log
          digest="$(sed -n 's/^Digest: //p' push.log)"
          [[ "${digest}" == sha256:* ]] || { echo "::error::could not determine chart digest"; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign chart
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${CHART#oci://}/unimq@${DIGEST}"
