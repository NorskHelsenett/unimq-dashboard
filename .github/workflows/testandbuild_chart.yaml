name: Test and build unimq-dashboard helm chart

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  lint-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5

      - name: Lint chart
        run: helm lint ./unimq

      - name: Template chart
        run: helm template unimq ./unimq
