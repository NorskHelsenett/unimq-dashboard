name: Test and build unimq-dashboard docker images

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [frontend, backend]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read toolchain versions
        run: |
          {
            echo "GO_VERSION=$(awk '/^go /{print $2}' go.mod)"
            echo "NODE_VERSION=$(tr -d '[:space:]' < web-src/.nvmrc)"
          } >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Build only, nothing is pushed. Reuses the amd64 release cache read-only
      # so pull requests do not churn the shared cache.
      - name: Build ${{ matrix.target }} image
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7
        env:
          PLATFORMS: linux/amd64
          CACHE_SCOPE: linux-amd64
        with:
          source: .
          files: ./docker-bake.hcl
          targets: ${{ matrix.target }}
          set: |
            *.cache-to=
