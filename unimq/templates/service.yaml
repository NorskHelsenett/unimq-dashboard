---
apiVersion: v1
kind: Service
metadata:
  name: "{{ $.Values.name }}-backend"
  namespace: "{{ $.Values.namespace }}"
  labels:
    app: "{{ $.Values.name }}-backend"
spec:
  selector:
    app: "{{ $.Values.name }}-backend"
  ports:
    - name: http
      port: {{ $.Values.service.backend.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: "{{ $.Values.name }}-frontend"
  namespace: "{{ $.Values.namespace }}"
  labels:
    app: "{{ $.Values.name }}-frontend"
spec:
  selector:
    app: "{{ $.Values.name }}-frontend"
  ports:
    - name: http
      port: {{ $.Values.service.frontend.port }}
      targetPort: http
