---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ $.Values.name }}-backend"
  labels:
    app: "{{ $.Values.name }}-backend"
  namespace: "{{ $.Values.namespace }}"
spec:
  replicas: { { $.Values.replicaCount } }
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: "{{ $.Values.name }}-backend"
  template:
    metadata:
      labels:
        app: "{{ $.Values.name }}-backend"
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 3000
        runAsUser: 2000
        runAsGroup: 3000
      containers:
        - name: "{{ $.Values.name }}-backend"
          image: "{{ $.Values.image.backend.repository }}:{{ $.Values.image.backend.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: "{{ $.Values.image.backend.pullPolicy }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: { { $.Values.service.backend.port } }
          resources:
            requests:
              memory: "{{ $.Values.resources.requests.backend.memory }}"
              cpu: "{{ $.Values.resources.requests.backend.cpu }}"
            limits:
              memory: "{{ $.Values.resources.limits.backend.memory }}"
              cpu: "{{ $.Values.resources.limits.backend.cpu }}"
          envFrom:
            - configMapRef:
                name: "{{ $.Values.name }}-configmap"
            - secretRef:
                name: '{{ $.Values.secret.existingSecret | default (printf "%s-secret" $.Values.name) }}'
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
