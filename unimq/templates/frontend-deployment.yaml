---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ $.Values.name }}-frontend"
  labels:
    app: "{{ $.Values.name }}-frontend"
  namespace: "{{ $.Values.namespace }}"
spec:
  replicas: {{ $.Values.replicaCount }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: "{{ $.Values.name }}-frontend"
  template:
    metadata:
      labels:
        app: "{{ $.Values.name }}-frontend"
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 3000
        runAsUser: 2000
        runAsGroup: 3000
      containers:
        - name: "{{ $.Values.name }}-frontend"
          image: "{{ $.Values.image.frontend.repository }}:{{ $.Values.image.frontend.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: "{{ $.Values.image.frontend.pullPolicy }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ $.Values.service.frontend.port }}
          resources:
            requests:
              memory: "16Mi"
              cpu: "20m"
            limits:
              memory: "64Mi"
          # nginx needs a few writable paths even with a read-only root filesystem
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-tmp
              mountPath: /tmp
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
